<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lead Desk — Multi-Site Lead Management Dashboard</title>
    <script>
      (function () {
        window.addEventListener(
          'error',
          function (event) {
            if (
              event &&
              typeof event.filename === 'string' &&
              event.filename.indexOf('chrome-extension://') === 0
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
        try {
          var d = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (d && d.configurable && !d.writable && !d.set && typeof d.get === 'function') {
            var origGet = d.get;
            var overrideFetch = null;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: d.enumerable,
              get: function () {
                return overrideFetch || origGet.call(window);
              },
              set: function (fn) {
                if (typeof fn === 'function') {
                  overrideFetch = fn;
                }
              },
            });
          }
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="Multi-site lead management dashboard with Supabase Auth, Realtime alerts, Kanban pipeline, and dynamic site routing rules."
    />
    <meta property="og:title" content="Lead Desk — Multi-Site Lead Management Dashboard" />
